name: drivehub
description: DriveHub - Premium Car Agency (UI built from Figma screens)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/cars/
    - assets/avatars/
    - assets/brands/

  # Optional: the Figma uses Poppins (home / listings headings) and Inter/Roboto
  # (everything else). Download them, drop the .ttf files in assets/fonts/ and
  # uncomment. Until then Flutter silently falls back to the system font.
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
